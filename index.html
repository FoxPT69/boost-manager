<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Rocket League Manager — Simulator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a2d;
      --panel-2: #17223a;
      --line: #273653;
      --muted: #91a1bd;
      --text: #eef4ff;
      --blue: #58c8ff;
      --blue-2: #2389dc;
      --lime: #c4f06b;
      --orange: #ffb454;
      --red: #ff6f82;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background:
        radial-gradient(ellipse at 82% -10%, rgba(35,137,220,.2), transparent 36rem),
        var(--bg);
      color: var(--text);
      font: 15px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, select { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; }
    .topbar {
      height: 76px;
      border-bottom: 1px solid rgba(145,161,189,.16);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 max(24px, calc((100vw - 1320px)/2));
      background: rgba(11,16,32,.88);
      position: sticky;
      top: 0;
      z-index: 3;
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 900; letter-spacing: .04em; }
    .brand-mark { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: #06101f; background: linear-gradient(135deg,var(--blue),var(--lime)); font-size: 21px; }
    .brand small { display: block; font-size: 10px; color: var(--muted); letter-spacing: .2em; font-weight: 700; }
    .top-meta { color: var(--muted); font-size: 13px; display:flex; align-items:center; gap: 18px; }
    .save-status { color: var(--lime); font-size: 12px; }
    .layout { max-width: 1320px; margin: auto; padding: 26px 24px 48px; display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 24px; }
    .layout.menu-mode { max-width: 960px; grid-template-columns: minmax(0,1fr); }
    .layout.menu-mode aside { display:none; }
    .career-menu { padding: clamp(20px,5vw,54px) 0; }
    .career-menu .page-head { margin-bottom:24px; }
    .career-menu-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
    .career-option { border:1px solid rgba(145,161,189,.14); background:linear-gradient(145deg,rgba(23,34,58,.95),rgba(18,26,45,.96)); border-radius:var(--radius); padding:20px; }
    .career-option h2 { margin-bottom:6px; }
    .career-option p { color:var(--muted); font-size:13px; min-height:40px; }
    .career-save-list { display:grid; gap:12px; margin-top:20px; }
    .career-save { display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .career-form { display:grid; gap:16px; max-width:600px; }
    .career-field { display:grid; gap:6px; color:var(--muted); font-size:13px; font-weight:700; }
    [hidden] { display:none !important; }
    .career-field select,.career-field input { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; background:#0d1527; color:var(--text); }
    .career-actions { display:flex; flex-wrap:wrap; gap:10px; }
    .logo-picker { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px; }
    .logo-choice { appearance:none;border:1px solid var(--line);background:#0d1527;border-radius:12px;padding:8px;aspect-ratio:1;cursor:pointer;transition:.15s transform,.15s border-color; }
    .logo-choice:hover { transform:translateY(-2px);border-color:var(--blue); }
    .logo-choice.selected { border-color:var(--blue);box-shadow:0 0 0 2px rgba(88,200,255,.2); }
    .logo-choice:focus-visible { outline:2px solid var(--blue);outline-offset:2px; }
    .logo-preview { width:76px;height:76px;border-radius:20px;overflow:hidden;box-shadow:0 8px 22px #0005; }
    .career-badge { display:inline-block; color:var(--blue); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    aside { align-self: start; position: sticky; top: 98px; }
    .club-card,.nav-card,.card,.stat-card {
      border: 1px solid rgba(145,161,189,.14);
      background: linear-gradient(145deg,rgba(23,34,58,.95),rgba(18,26,45,.96));
      border-radius: var(--radius);
    }
    .club-card { padding: 18px; margin-bottom: 18px; }
    .club-avatar { width: 48px; height: 48px; border-radius: 15px; display:grid;place-items:center; background:linear-gradient(135deg,#5948c8,#31b4e9); font-size:24px; margin-bottom: 14px; overflow:hidden; }
    .club-avatar svg,.team-logo svg,.logo-choice svg,.logo-preview svg { width:100%;height:100%;display:block; }
    .club-name { font-weight: 850; font-size: 17px; }
    .club-tier { color: var(--muted); font-size: 12px; margin-top: 3px; }
    .nav-card { padding: 8px; }
    .nav-btn { border:0; width:100%; text-align:left; color:var(--muted); background:transparent; padding:12px; border-radius:10px; margin:2px 0; display:flex; gap:12px; align-items:center; }
    .nav-btn:hover,.nav-btn.active { background:rgba(88,200,255,.13); color:var(--text); }
    .nav-btn.active { box-shadow:inset 3px 0 var(--blue); }
    .nav-icon { width:20px; text-align:center; }
    .nav-row { display:none; }
    @media (max-width:900px) { .nav-row { display:flex; } }
    main { min-width:0; }
    .page-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:3px 0 22px; }
    .eyebrow { color:var(--blue); font-size:11px; font-weight:800; letter-spacing:.17em; text-transform:uppercase; }
    h1 { margin:5px 0 0; font-size:clamp(25px,3vw,34px); line-height:1.15; letter-spacing:-.04em; }
    h2 { font-size:17px; margin:0; letter-spacing:-.02em; }
    h3 { margin:0; font-size:14px; }
    .subhead { color:var(--muted); margin-top:5px; }
    .button { border:1px solid var(--line); border-radius:10px; padding:10px 14px; background:#202d48; color:var(--text); font-weight:750; transition:.15s ease; }
    .button:hover { filter:brightness(1.14); transform:translateY(-1px); }
    .button.primary { color:#06101f; border-color:transparent; background:linear-gradient(100deg,var(--blue),#82e3ff); }
    .button.green { color:#111808; border:0; background:var(--lime); }
    .button.danger { color:#ffdce1; border-color:rgba(255,111,130,.3); background:rgba(255,111,130,.12); }
    .button.small { padding:7px 10px; font-size:12px; }
    .button:disabled { opacity:.45; cursor:not-allowed; transform:none; }
    .grid { display:grid; gap:16px; }
    .stats-grid { grid-template-columns:repeat(4,minmax(0,1fr)); margin-bottom:18px; }
    .stat-card { padding:16px 18px; }
    .stat-label { color:var(--muted); font-size:12px; }
    .stat-value { font-size:25px; font-weight:850; margin-top:5px; letter-spacing:-.04em; }
    .stat-foot { font-size:11px; color:var(--lime); margin-top:3px; }
    .two-col { grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr); }
    .card { padding:20px; }
    .card-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; }
    .muted { color:var(--muted); }
    .tiny { font-size:12px; }
    .match-card { background:
      linear-gradient(115deg,rgba(17,43,72,.95),rgba(17,29,51,.98)),
      var(--panel); overflow:hidden; position:relative; }
    .match-card:after { content:""; position:absolute; width:220px; height:220px; border:1px solid rgba(88,200,255,.14); border-radius:50%; right:-70px; top:-110px; box-shadow:0 0 0 30px rgba(88,200,255,.03),0 0 0 65px rgba(88,200,255,.025); }
    .match-title { display:flex; align-items:center; gap:8px; color:var(--blue); font-size:11px; font-weight:850; letter-spacing:.14em; text-transform:uppercase; }
    .versus { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:18px; margin:24px 0; }
    .team { display:flex; align-items:center; gap:12px; }
    .team.right { justify-content:flex-end; text-align:right; }
    .team-logo { width:48px;height:48px;border-radius:14px;background:#273e62;display:grid;place-items:center;font-size:22px; }
    .team.right .team-logo { order:2; background:#4c305c; }
    .team-label { font-size:17px; font-weight:850; }
    .team-rating { color:var(--muted); font-size:12px; }
    .versus-mark { color:#62728d; font-weight:900; font-size:13px; }
    .match-actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .event-progress { margin-top:17px; display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; }
    .progress { flex:1; height:5px; background:#273653; border-radius:9px; overflow:hidden; }
    .progress span { display:block; height:100%; background:var(--blue); border-radius:inherit; }
    .roster-mini { display:grid; gap:12px; }
    .player-row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 12px; border:1px solid rgba(145,161,189,.12); border-radius:12px; background:rgba(7,13,27,.25); }
    .player-info { display:flex; align-items:center; gap:11px; min-width:0; }
    .player-avatar { width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;background:#263a59;font-size:15px;font-weight:850;color:#aee7ff;overflow:hidden; }
    .player-avatar svg { width:100%;height:100%;display:block; }
    .player-avatar.big { width:84px;height:84px;border-radius:22px; }
    .detail-title { display:flex;gap:18px;align-items:center; }
    .search-wrap { position:relative;flex:1;max-width:460px;margin:0 18px; }
    .search-wrap[hidden] { display:none; }
    #global-search { width:100%;padding:9px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font:inherit;font-size:13px; }
    .search-results { position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.5);z-index:60;padding:6px; }
    .search-results[hidden] { display:none; }
    .sr-group { font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px; }
    .sr-item { display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:var(--text);padding:7px 10px;border-radius:9px;cursor:pointer;text-align:left;font:inherit;font-size:13px; }
    .sr-item:hover { background:var(--panel-2); }
    .sr-av { width:26px;height:26px;border-radius:8px;overflow:hidden;flex:none; }
    .sr-av svg { width:100%;height:100%;display:block; }
    .sr-label { font-weight:700; }
    .sr-sub { margin-left:auto;color:var(--muted);font-size:11px; }
    .sr-empty { padding:14px;color:var(--muted);font-size:13px; }
    .plink { color:inherit;text-decoration:none; }
    .plink:hover { color:var(--blue);text-decoration:underline; }
    .lb-filters { display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0; }
    .lb-filters select,.lb-filters input[type=search] { background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font:inherit;font-size:12px; }
    .lb-check { font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center; }
    .lb-av { display:inline-block;width:28px;height:28px;border-radius:9px;overflow:hidden;vertical-align:middle; }
    .lb-av svg { width:100%;height:100%;display:block; }
    .lb-me td { background:rgba(196,240,107,.08); }
    .up { color:var(--lime);font-size:11px; } .down { color:var(--red);font-size:11px; }
    .scout-card { border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px; }
    .meter-row { display:grid;grid-template-columns:80px 1fr 30px;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px; }
    .meter-row .meter { height:6px;background:#1e2b46;border-radius:6px;overflow:hidden; }
    .meter-row .meter span { display:block;height:100%;background:var(--blue); }
    .set-row { display:flex;align-items:center;gap:12px;justify-content:space-between;padding:7px 0;font-size:13px; }
    .set-row input[type=range] { flex:1;max-width:240px; }
    .set-row select { background:var(--panel-2);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:6px 10px;font:inherit; }
    .set-title { margin:16px 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue); }
    .modal-backdrop { position:fixed;inset:0;background:rgba(3,6,14,.7);z-index:90; }
    .modal-card { position:fixed;z-index:91;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,92vw);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px; }
    .reduce-motion * { animation:none !important;transition:none !important; }
    .player-name { font-weight:750; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .player-meta { color:var(--muted); font-size:11px; }
    .rating { text-align:right;font-size:18px;font-weight:850; }
    .rating small { display:block;font-size:10px;color:var(--muted);font-weight:600; }
    .meter-row { display:grid; grid-template-columns:80px 1fr 38px; gap:10px; align-items:center; margin:12px 0; font-size:12px; }
    .meter { height:7px; background:#26344e; border-radius:8px; overflow:hidden; }
    .meter span { display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--blue-2),var(--blue)); }
    .meter.lime span { background:linear-gradient(90deg,#82ba40,var(--lime)); }
    .news-list { display:grid; gap:0; }
    .news-item { padding:12px 0; border-bottom:1px solid rgba(145,161,189,.12); }
    .news-item:last-child { border:0; padding-bottom:0; }
    .news-date { font-size:10px;color:var(--blue);font-weight:800;letter-spacing:.08em;text-transform:uppercase; }
    .news-text { margin-top:3px; font-size:13px; }
    .pill { display:inline-flex; align-items:center; border:1px solid rgba(88,200,255,.22); color:#aee7ff; background:rgba(88,200,255,.08); border-radius:99px; font-size:10px; padding:4px 8px; font-weight:800; white-space:nowrap; }
    .pill.green { color:var(--lime); border-color:rgba(196,240,107,.2); background:rgba(196,240,107,.07); }
    .pill.orange { color:var(--orange); border-color:rgba(255,180,84,.2); background:rgba(255,180,84,.07); }
    .section-gap { margin-top:16px; }
    .player-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .player-card { padding:17px; }
    .player-card-top { display:flex;align-items:center;justify-content:space-between; }
    .player-card h3 { font-size:16px; }
    .role { color:var(--muted);font-size:12px;margin-top:2px; }
    .attribute-grid { display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0; }
    .attribute { background:rgba(7,13,27,.38);border-radius:9px;padding:8px;text-align:center; }
    .attribute b { display:block;font-size:15px; }
    .attribute span { color:var(--muted);font-size:9px; }
    select { border:1px solid var(--line); background:#0d1628; color:var(--text); border-radius:9px; padding:9px 11px; outline:none; }
    select:focus { border-color:var(--blue); }
    .lineup-list { display:grid;gap:12px; }
    .lineup-slot { display:grid;grid-template-columns:100px 1fr;gap:12px;align-items:center; }
    .lineup-slot label { color:var(--muted);font-size:12px;font-weight:750; }
    .form-row { display:grid;gap:7px;margin:14px 0; }
    .form-row label { color:var(--muted);font-size:12px;font-weight:700; }
    .training-options { display:grid;grid-template-columns:repeat(2,1fr);gap:10px; }
    .training-option { text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(7,13,27,.25);color:var(--text); }
    .training-option.selected { border-color:var(--blue);background:rgba(88,200,255,.1); }
    .training-option strong { display:block;font-size:13px; }
    .training-option span { display:block;color:var(--muted);font-size:11px;margin-top:5px; }
    .table-wrap { overflow-x:auto; }
    table { width:100%;border-collapse:collapse;min-width:440px; }
    th,td { padding:12px 10px;text-align:left;border-bottom:1px solid rgba(145,161,189,.12);font-size:13px; }
    th { color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em; }
    tr:last-child td { border:0; }
    .schedule { display:grid;gap:10px; }
    .schedule-item { display:grid;grid-template-columns:45px 1fr auto;gap:12px;align-items:center;padding:13px;border:1px solid rgba(145,161,189,.12);border-radius:12px; }
    .schedule-tier { font-weight:900;color:var(--blue); }
    .schedule-name { font-weight:750; }
    .schedule-detail { color:var(--muted);font-size:11px; }
    .ranked-layout { display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr);gap:16px; }
    .ranked-player-selects { display:grid;gap:10px;margin-top:16px; }
    .ranked-player-select { display:grid;grid-template-columns:85px 1fr;gap:12px;align-items:center; }
    .ranked-player-select label { color:var(--muted);font-size:12px;font-weight:750; }
    .rank-summary { display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px;border:1px solid rgba(88,200,255,.16);border-radius:12px;background:rgba(7,13,27,.25);margin-top:16px; }
    .rank-summary strong { font-size:24px; }
    .ranked-history { display:grid;gap:8px; }
    .ranked-history-item { display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid rgba(145,161,189,.12);border-radius:12px; }
    .ranked-history-item.win { border-color:rgba(196,240,107,.22); }
    .ranked-history-item.loss { border-color:rgba(255,111,130,.2); }
    .rank-delta { font-weight:850;white-space:nowrap; }
    .calendar-toolbar { display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px; }
    .calendar-jump { display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px;border:1px solid rgba(88,200,255,.15);border-radius:12px;background:rgba(7,13,27,.25); }
    .calendar-jump label { color:var(--muted);font-size:12px;font-weight:750; }
    .calendar-jump input { min-height:38px;border:1px solid var(--line);border-radius:9px;padding:6px 9px;background:#0d1527;color:var(--text); }
    .calendar-weekdays,.calendar-grid { display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px; }
    .calendar-weekday { text-align:center;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:7px 0; }
    .calendar-day { display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-height:86px;padding:9px;border:1px solid rgba(145,161,189,.12);border-radius:11px;background:rgba(7,13,27,.25);color:var(--text); }
    .calendar-day:hover,.calendar-day.selected { border-color:var(--blue);background:rgba(88,200,255,.1); }
    .calendar-day.today { box-shadow:inset 0 0 0 1px var(--lime); }
    .calendar-day.outside { opacity:.38; }
    .calendar-day-number { font-weight:850; }
    .calendar-day-event { color:var(--blue);font-size:10px;line-height:1.2; }
    .calendar-agenda-item { display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid rgba(145,161,189,.12); }
    .calendar-agenda-item:last-child { border:0; }
    .calendar-agenda-dot { width:9px;height:9px;flex:none;border-radius:50%;background:var(--blue); }
    .calendar-agenda-dot.win { background:var(--lime); }
    .calendar-agenda-dot.loss { background:var(--red); }
    .empty { border:1px dashed var(--line);border-radius:12px;text-align:center;padding:26px;color:var(--muted); }
    .toast { position:fixed;right:24px;bottom:24px;z-index:10;background:#eaf4ff;color:#10192a;border-radius:12px;padding:13px 17px;box-shadow:0 12px 40px #0008;font-weight:750;max-width:min(400px,calc(100vw - 48px));animation:rise .2s ease; }
    @keyframes rise { from { transform:translateY(8px);opacity:0; } to { transform:translateY(0);opacity:1; } }
    .footer-note { margin-top:18px;color:#71819c;font-size:11px; }
    .title-stack { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
    .stars { color:#ffd25a; letter-spacing:1px; font-size:14px; white-space:nowrap; }
    .stars-off { color:#3a4a66; }
    .menu-hero { border-radius:18px;overflow:hidden;margin-bottom:18px;border:1px solid var(--line);box-shadow:0 12px 40px #0006; }
    .menu-hero img { display:block;width:100%;height:auto;max-height:46vh;object-fit:cover; }
    .title-chip { display:inline-flex; align-items:center; gap:6px; padding:6px 8px; border-radius:999px; background:rgba(88,200,255,.12); color:var(--blue); font-size:10px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; }
    @media (max-width:900px) {
      .layout { grid-template-columns:minmax(0,1fr); }
      aside { position:static;min-width:0;width:100%; }
      .club-card { display:none; }
      .nav-card { display:block;width:100%;min-width:0;padding:4px; }
      #nav-flat { display:none; }
      .nav-row { display:flex;gap:4px;justify-content:space-around; }
      #nav-subs { margin-top:2px;border-top:1px solid var(--line);padding-top:4px; }

    function scheduledWeekdayAfter(startDate,weekday,weekOffset=0) {
      const date=parseGameDate(startDate);
      let days=(weekday-date.getUTCDay()+7)%7;
      if(days===0) days=7;
      date.setUTCDate(date.getUTCDate()+days+weekOffset*7);
      return date.toISOString().slice(0,10);
    }
    function buildTournamentSchedule(startDate) {
      return TOURNAMENTS.map((event,index)=>({...event,status:index===0?"active":"locked",result:null,scheduledDate:scheduledWeekdayAfter(startDate,4,index)}));
    }
    function scheduledLeagueDate(startDate,weekOffset,dayOffset) {
      const date=parseGameDate(startDate);
      const weekday=date.getUTCDay()||7;
      date.setUTCDate(date.getUTCDate()+(8-weekday)+weekOffset*7+dayOffset);
      return date.toISOString().slice(0,10);
    }
    function buildLeagueSchedule(leagueId,startDate,season,teamName) {
      const league=LEAGUE_SPECS.find(item=>item.id===leagueId)||LEAGUE_SPECS[0];
      const opponents=league.teams.filter(team=>team!==teamName);
      while(opponents.length<4) opponents.push(`${league.teams[opponents.length%league.teams.length]} Academy`);
      const userMatches=Array.from({length:12},(_,index)=>{
        const opponent=opponents[Math.floor(index/3)];
        const home=index%2===0;
        return {
          id:`${season}-user-${index+1}`,leagueId:league.id,season,date:scheduledLeagueDate(startDate,Math.floor(index/2),index%2===0?1:5),
          home:home?teamName:opponent,away:home?opponent:teamName,involvesUser:true,status:"scheduled",win:null,score:null
        };
      });
      const uniqueRivalPairs=[];
      for(let first=0;first<opponents.length;first++) {
        for(let second=first+1;second<opponents.length;second++) {
          uniqueRivalPairs.push([opponents[first],opponents[second]]);
        }
      }
      const rivalMatches=[];
      uniqueRivalPairs.forEach(([home,away],pairIndex)=>{
        for(let replay=0;replay<3;replay++) {
          const index=pairIndex*3+replay;
          rivalMatches.push({
            id:`${season}-rival-${index+1}`,leagueId:league.id,season,
            date:scheduledLeagueDate(startDate,(pairIndex+replay*2)%6,[0,2,4][replay]),
            home,away,involvesUser:false,status:"scheduled",win:null,score:null
          });
        }
      });
      return [...userMatches,...rivalMatches].sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
    }

    function stableValue(seed,modulus) {
      let value=0;
      for(const char of seed) value=(value*31+char.charCodeAt(0))%2147483647;
      return value%modulus;
    }
    function leagueTeams(league) {
      const roles=["Playmaker","Striker","Anchor"];
      const names=["Ari","Noah","Luca","Theo","Alex","Leo","Davi","Yuki","Sam","Ivo","Mika","Rui"];
      return league.teams.map((team,index)=>{
        const teamOvr=66+stableValue(`${league.id}${team}`,18);
        const roster=roles.map((role,slot)=>{
          const seed=stableValue(`${team}${slot}`,names.length);
          const skill=teamOvr-3+stableValue(`${league.id}${slot}${team}`,7);
          return {name:names[seed],role,OVR:skill};
        });
        const wins=Math.max(1,8-index*2+stableValue(`${team}w`,4));
        const losses=7+index*2+stableValue(`${team}l`,4);
        return {name:team,OVR:Math.round(roster.reduce((sum,p)=>sum+p.OVR,0)/roster.length),roster,wins,losses,points:wins*3};
      }).sort((a,b)=>b.points-a.points||b.OVR-a.OVR);
    }
    function renderLeagues() {
      const selected=LEAGUE_SPECS.find(league=>league.id===state.selectedLeague)||LEAGUE_SPECS[0];
      const teams=leagueTeams(selected).filter(team=>selected.id!==state.careerLeagueId||team.name!==state.teamName);
      if(selected.id===state.careerLeagueId) {
        teams.forEach(team=>{
          const record=state.leagueMatches.filter(match=>match.status==="done"&&(match.home===team.name||match.away===team.name));
          team.wins=record.filter(match=>match.winner===team.name).length;
          team.losses=record.length-team.wins;
          team.points=team.wins*3;
        });
        const played=state.leagueMatches.filter(match=>match.involvesUser&&match.status==="done");
        const wins=played.filter(match=>match.win).length;
        const teamRoster=starters().map(player=>({name:player.name,role:player.role,OVR:ovr(player)}));
        teams.push({name:state.teamName,OVR:Math.round(teamRoster.reduce((sum,player)=>sum+player.OVR,0)/Math.max(1,teamRoster.length)),roster:teamRoster,wins,losses:played.length-wins,points:wins*3});
        teams.sort((a,b)=>b.points-a.points||b.OVR-a.OVR);
      }
      const completedLeagueMatches=state.leagueMatches.filter(match=>match.involvesUser&&match.status==="done").length;
      const nextLeagueMatches=state.leagueMatches.filter(match=>match.involvesUser&&match.status==="scheduled").slice(0,4);
      const regionNames=[...new Set(LEAGUE_SPECS.map(league=>league.region))];
      return `<div class="page-head"><div><div class="eyebrow">Ligas nacionais e continentais</div><h1>Ligas & classificações</h1><div class="subhead">Explora ligas por país, região RLCS e campeonatos continentais.</div></div><span class="pill">${LEAGUE_SPECS.length} LIGAS</span></div>
        <div class="grid two-col">
          <section class="card"><div class="card-head"><div><h2>Escolher competição</h2><div class="muted tiny">País, região RLCS ou torneio continental</div></div></div>
            <div class="form-row"><label for="league-select">Liga ou região</label><select id="league-select" data-league>${LEAGUE_SPECS.map(league=>`<option value="${league.id}" ${league.id===selected.id?"selected":""}>${esc(league.name)}</option>`).join("")}</select></div>
            <div class="schedule-item"><div class="schedule-tier">◎</div><div><div class="schedule-name">${esc(selected.name)}</div><div class="schedule-detail">${esc(selected.region)} · ${selected.country==="Regional"?"Circuito regional":selected.country==="Continental"?"Taça intercontinental":esc(selected.country)} · Época ${state.season}</div></div><span class="pill green">ATIVA</span></div>
            <p class="footer-note">${selected.id===state.careerLeagueId?`A tua liga tem 12 jogos: dois por semana durante seis semanas. Progresso ${completedLeagueMatches}/12.`:"Tabela demonstrativa para observação; a carreira disputa a liga associada à equipa escolhida."} Os torneios de meio da semana são disputados apenas quando desbloqueados.</p>
            <div class="section-gap"><h3>Regiões disponíveis</h3><div class="match-actions section-gap">${regionNames.map(region=>`<span class="pill">${esc(region)}</span>`).join("")}</div></div>
          </section>
          <section class="card"><div class="card-head"><h2>Classificação</h2><span class="pill">${teams.length} EQUIPAS</span></div><div class="table-wrap"><table><thead><tr><th>#</th><th>Equipa</th><th>V-D</th><th>OVR</th><th>Pts</th></tr></thead><tbody>${teams.map((team,index)=>`<tr><td>${index+1}</td><td><b>${esc(team.name)}</b></td><td>${team.wins}-${team.losses}</td><td>${team.OVR}</td><td>${team.points}</td></tr>`).join("")}</tbody></table></div><p class="footer-note">Classificações simuladas para o protótipo; não representam resultados oficiais.</p></section>
        </div>
        ${selected.id===state.careerLeagueId?`<section class="card section-gap"><div class="card-head"><div><h2>Próximos jogos da liga</h2><div class="muted tiny">${completedLeagueMatches}/12 concluídos · dois jogos por semana</div></div><button class="button small" data-page="calendar">Abrir calendário</button></div>${nextLeagueMatches.length?nextLeagueMatches.map(match=>`<div class="schedule-item"><div class="schedule-tier">L</div><div><div class="schedule-name">${esc(match.home)} vs ${esc(match.away)}</div><div class="schedule-detail">${esc(formatGameDate(match.date))}</div></div><span class="pill">AGENDADO</span></div>`).join(""):`<div class="empty">A época da liga está concluída.</div>`}</section>`:""}
        <section class="card section-gap"><div class="card-head"><div><h2>Equipas e jogadores</h2><div class="muted tiny">Plantéis simulados das equipas nesta liga</div></div></div><div class="grid player-grid">${teams.map(team=>`<article class="card player-card"><div class="player-card-top"><div><h3>${esc(team.name)}</h3><div class="role">${esc(selected.region)} · ${team.wins} vitórias · ${team.points} pts</div></div><div class="rating">${team.OVR}<small>OVR equipa</small></div></div><div class="roster-mini section-gap">${team.roster.map(player=>`<div class="player-row"><div><div class="player-name">${esc(player.name)}</div><div class="player-meta">${esc(player.role)} · ${esc(selected.country)}</div></div><b>${player.OVR}</b></div>`).join("")}</div></article>`).join("")}</div></section>`;
    }
    function getOpenEvent() {
      return OPEN_EVENTS.find(event=>event.id===state.selectedOpenEvent)||OPEN_EVENTS[0];
    }
    function observedRoster(teamName) {
      const names=["Astra","Blitz","Comet","Drift","Echo","Flux","Glitch","Horizon","Ion","Jett","Kairo","Lumen","Mako","Orbit","Pulse","Quasar","Rift","Sol","Vex","Wisp"];
      const base=70+stableValue(teamName,18);
      return ["Playmaker","Striker","Third man"].map((role,index)=>({
        name:names[stableValue(`${teamName}${index}`,names.length)],
        role,
        OVR:Math.min(96,base+stableValue(`${teamName}-${index}`,9)-4)
      }));
    }
    function renderScouting() {
      const competition=getOpenEvent();
      const teams=competition.teams.map(team=>team==="Nova Esports"?state.teamName:team);
      if(!teams.includes(state.selectedOpenTeam)) state.selectedOpenTeam=teams[0];
      const selectedRoster=observedRoster(state.selectedOpenTeam);
      const standings=teams.map((name,index)=>({name,OVR:Math.round(observedRoster(name).reduce((sum,p)=>sum+p.OVR,0)/3),wins:8-index+stableValue(name,3),points:(8-index+stableValue(name,3))*3})).sort((a,b)=>b.points-a.points||b.OVR-a.OVR);
      return `<div class="page-head"><div><div class="eyebrow">Observação de equipas e jogadores</div><h1>Observatório do circuito</h1><div class="subhead">Segue eventos abertos, RLCS e Majors. Consulta classificações, plantéis e títulos.</div></div><span class="pill green">SCOUTING ATIVO</span></div>

          <section class="card"><div class="card-head"><div><h2>Competição aberta</h2><div class="muted tiny">Eventos simulados para observação</div></div></div><div class="form-row"><label for="open-event-select">Evento</label><select id="open-event-select" data-open-event>${OPEN_EVENTS.map(event=>`<option value="${event.id}" ${event.id===competition.id?"selected":""}>Tier ${event.tier} · ${esc(event.name)}</option>`).join("")}</select></div>
            <div class="schedule-item"><div class="schedule-tier">${competition.tier}</div><div><div class="schedule-name">${esc(competition.name)}</div><div class="schedule-detail">${esc(competition.region)} · ${esc(competition.format)} · ${teams.length} equipas visíveis</div></div><span class="pill green">EM OBSERVAÇÃO</span></div>
            <p class="footer-note">Resultados, participantes e plantéis são conteúdo de demonstração, não um feed oficial em direto.</p>
          </section>

    function playNationsCup() {
      if(state.nationTournamentPlayed) return toast("A Nations Cup desta época já foi disputada.");
      const country=INTERNATIONAL_TEAMS.find(team=>team.country===state.selectedNation);
      const called=state.roster.filter(player=>player.nationality===state.selectedNation&&state.calledUp.includes(player.id));
      if(!country||called.length===0)return toast("Convoca pelo menos um jogador da nacionalidade selecionada.");
      const guestOvr=Math.max(58,country.strength-4);
      const teamPower=(called.reduce((sum,player)=>sum+ovr(player),0)+(3-called.length)*guestOvr)/3;
      const rivals=INTERNATIONAL_TEAMS.filter(team=>team.country!==country.country).sort((a,b)=>stableValue(`${state.season}${country.country}${a.country}`,100)-stableValue(`${state.season}${country.country}${b.country}`,100)).slice(0,3);
      let wins=0,losses=0,scoreLines=[];
      for(const rival of rivals) {
        let ownGoals=0,rivalGoals=0;
        for(let chance=0;chance<8;chance++) {
          const ownAttack=Math.random()<.5;
          const power=ownAttack?teamPower:rival.strength;
          const defense=ownAttack?rival.strength:teamPower;
          if(Math.random()<Math.max(.08,Math.min(.68,.25+(power-defense)*.012))) {
            if(ownAttack)ownGoals++;else rivalGoals++;
          }
        }
        if(ownGoals===rivalGoals) {
          const clutch=called.reduce((sum,player)=>sum+player.CLU,0)/called.length;
          if(Math.random()<.5+(teamPower-rival.strength)*.01+clutch*.001)ownGoals++;
          else rivalGoals++;
        }
        if(ownGoals>rivalGoals)wins++;else losses++;
        scoreLines.push(`${rival.country} ${ownGoals}–${rivalGoals}`);
      }
      const win=wins>=2;
      state.nationTournamentPlayed=true;
      state.nationResult={country:country.country,opponent:"3 seleções",score:`${wins}V–${losses}D`,win,scoreLines};
      called.forEach(player=>{player.mental=Math.max(-10,Math.min(10,player.mental+(win?2:1)));});
      addNews(`${country.country} terminou a Nations Cup com ${wins} vitória(s) e ${losses} derrota(s). ${called.map(player=>player.name).join(", ")} representou(aram) a seleção.`);
      render();toast(win?`Boa campanha internacional: ${wins} vitórias.`:`Nations Cup concluída: ${wins} vitórias.`);
    }

    function calendarScheduleItems(date) {
      const league=state.leagueMatches.filter(match=>match.involvesUser&&match.date===date).map(match=>({kind:"league",match}));
      const tournaments=state.schedule.filter(event=>event.scheduledDate===date||event.playedDate===date).map(event=>({kind:"tournament",event}));

    function simulateLeagueFixture(match) {
      if(match.status!=="scheduled") return null;
      const involvesUser=match.involvesUser&&(match.home===state.teamName||match.away===state.teamName);
      const players=involvesUser?starters():[];
      if(involvesUser&&players.length!==3) return null;
      const strength=team=>involvesUser&&team===state.teamName
        ?players.reduce((sum,player)=>sum+ovr(player),0)/3+state.synergy*.05+avg("mental",players)*.25
        :64+stableValue(`${match.leagueId}-${team}`,21)+(involvesUser&&team!==state.teamName?(DIFFICULTIES[state.difficulty]?.opponentModifier||0):0);
      const result=simulateCompetitiveGame(strength(match.home),strength(match.away),48);
      const winner=result.ownGoals>result.opponentGoals?match.home:match.away;
      const win=involvesUser&&winner===state.teamName;
      match.status="done";
      match.winner=winner;
      match.win=involvesUser?win:null;
      match.score=`${result.ownGoals}–${result.opponentGoals}`;
      match.playedDate=state.gameDate;
      if(involvesUser) {
        players.forEach(player=>{
          player.energy=Math.max(18,player.energy-4-Math.random()*3);
          player.mental=Math.max(-10,Math.min(10,player.mental+(win?1:-1)));
        });
        state.synergy=Math.min(100,state.synergy+1);
        addNews(`${win?"Vitória":"Derrota"} na liga ${match.score} contra ${match.home===state.teamName?match.away:match.home}.`);
        return win;
      }
      return "simulated";
    }

    function nextRandomOpponent() {
      const event=activeEvent();
      const base=starters().reduce((s,p)=>s+ovr(p),0)/Math.max(starters().length,1);
      const tierOffset={E:-4,D:0,C:3,B:6,A:8,S:11}[event?.tier||"E"];

    function simulateMatch(quiet=false) {
      const event=activeEvent();
      if(!event) {if(!quiet) toast("A época terminou. Começa uma nova época para continuar.");return false;}
      if(starters().length!==3) {if(!quiet) toast("Seleciona três titulares diferentes antes da partida.");return false;}
      const opponent=nextRandomOpponent();
      const opponentName=["Pixel United","Aerial Syndicate","Boost Bandits","Neon Strikers","Overtime Club"][state.played%5];
      let ours=0,theirs=0,goals=[];
      const players=starters();
      const opponentTactic=["physical","possession","counter"][Math.floor(Math.random()*3)];
      const tacticAdvantage={physical:"possession",possession:"counter",counter:"physical"};
      const tacticDisadvantage={physical:"counter",possession:"physical",counter:"possession"};
      const strategicMult=tacticAdvantage[state.tactic]===opponentTactic ? 1.05 : tacticDisadvantage[state.tactic]===opponentTactic ? 0.95 : 1;
      const synergyMult=1+.15*(state.synergy/100);
      const energyMult=.9+.1*(avg("energy",players)/100);
      const mentalMult=Math.max(.9,Math.min(1.1,1+avg("mental",players)*.01));
      const boost=state.bootcamp&&["A","S"].includes(event.tier)?1.05:1;
      const teamPower=players.reduce((s,p)=>s+ovr(p),0)/3*synergyMult*energyMult*mentalMult*strategicMult*boost;
      const opponentPower=opponent*(.9+Math.random()*.2);
      const chances=10+Math.floor(Math.random()*7);
      for(let i=0;i<chances;i++) {
        const attackUs=Math.random()<.5;
        const attack=attackUs?teamPower:opponentPower;
        const defense=attackUs?opponentPower:teamPower;
        const offenseSkill=attackUs?avg("SHO",players)*.55+avg("AER",players)*.45:opponent;
        const defenseSkill=attackUs?opponent:avg("DEF",players)*.5+avg("ROT",players)*.3+avg("COM",players)*.2;
        let chance=Math.max(.08,Math.min(.72,.28+(attack-defense)*.009+(offenseSkill-defenseSkill)*.004));
        if(state.bootcamp&&["A","S"].includes(event.tier)&&attackUs) chance=Math.min(.78,chance+.02);
        if(Math.random()<chance) {
          if(attackUs) ours++; else theirs++;
          goals.push(attackUs?state.teamName:"Adversário");
        }
      }
      if(ours===theirs) {
        let ot=0;
        while(ours===theirs&&ot<12) {
          ot++;
          const clutch=avg("CLU",players)*.3;
          const usChance=Math.max(.12,Math.min(.8,.5+(teamPower-opponentPower)*.01+clutch*.003));
          if(Math.random()<(usChance+.5)/2) ours++; else theirs++;
        }
      }
      const win=ours>theirs;
      const score=`${ours}–${theirs}`;
      state.lastMatch={win,score,opponent:opponentName,event:event.name};
      event.playedDate=state.gameDate;
      state.played++;
      if(win) {
        state.wins++;state.money+=event.reward;state.points+=event.points;
        event.status="done";event.result={win:true,score};
        addNews(`Vitória ${score} frente a ${opponentName}. A equipa recebe ${fmtMoney(event.reward)} e ${event.points} pontos.`);
        const next=state.schedule.find(e=>e.status==="locked");
        if(next) {next.status="active";addNews(`${next.name} desbloqueado · Tier ${next.tier}.`);}
        if(!quiet) toast(`Vitória! ${score} — prémio de ${fmtMoney(event.reward)}.`);
      } else {
        state.losses++;event.status="done";event.result={win:false,score};
        addNews(`Eliminação ${score} frente a ${opponentName}. A equipa regressa aos treinos.`);
        const next=state.schedule.find(e=>e.status==="locked");
        if(next) next.status="active";
        if(!quiet) toast(`Derrota ${score}. Continua a treinar para o próximo evento.`);
      }
      players.forEach(p=>{p.energy=Math.max(18,p.energy-10-Math.random()*8);p.mental=Math.max(-10,Math.min(10,p.mental+(win?1:-1)));});
      applyPlayerCareerGrowth(players,{source:"tournament",win,impact:event.points/100});
      const earnedTitles=awardTournamentTitles(event,players,win);
      if(earnedTitles.length) addNews(`${earnedTitles.join(", ")} recebeu(beram) título(s) após ${event.name}.`);
      state.synergy=Math.min(100,state.synergy+2);
      if(state.bootcamp&&["A","S"].includes(event.tier)) state.bootcamp=false;
      if(!quiet) render();
      return win;
    }

    function simulateCompetitiveGame(ownStrength,opponentStrength,ratingScale=100) {
      let ownGoals=0,opponentGoals=0;
      const advantage=ownStrength-opponentStrength;
      const winProbability=1/(1+Math.pow(10,-advantage/ratingScale));
      const edge=(winProbability-.5)*.5;
      const ownChance=.25+edge;
      const opponentChance=.25-edge;
      for(let chance=0;chance<10;chance++) {
        if(Math.random()<ownChance) ownGoals++;
        if(Math.random()<opponentChance) opponentGoals++;
      }
      while(ownGoals===opponentGoals) {
        if(Math.random()<winProbability) ownGoals++;
        else opponentGoals++;
      }
      return {ownGoals,opponentGoals};
    }

        state.rankedGamesToday=0;
      }
      if(state.rankedGamesToday>=RANKED_DAILY_LIMIT)return toast(`Limite de ${RANKED_DAILY_LIMIT} partidas ranked atingido. Avança um dia no calendário.`);
      if(players.length!==RANKED_MODES[mode].players)return toast("Seleciona o número certo de jogadores para esta fila.");
      const teamMMR=averageMMR(players,mode);
      const opponentMMR=Math.max(400,Math.round(teamMMR+(Math.random()*120-60)));
      // Força real vem do overall; o MMR converge para o nível de skill
      const teamSkill=Math.round(players.reduce((s,p)=>s+skillMMR(p,mode),0)/players.length);
      const result=simulateCompetitiveGame(teamSkill,opponentMMR,400);
      const win=result.ownGoals>result.opponentGoals;
      const expected=1/(1+Math.pow(10,(opponentMMR-teamMMR)/400));
      const gap=teamSkill-teamMMR;
      const k=28*(1+Math.min(.8,Math.abs(gap)/400));
      let delta=Math.round(k*((win?1:0)-expected));
      if(win&&delta<1) delta=1;
      if(!win&&delta>-1) delta=-1;
      players.forEach(player=>{
        player.rankedMMR[mode]=Math.max(0,player.rankedMMR[mode]+delta);
        player.rankedGames[mode]++;
        player.rankedWins=player.rankedWins||{};
        player.rankedLosses=player.rankedLosses||{};
        const record=win?player.rankedWins:player.rankedLosses;
        record[mode]=(record[mode]||0)+1;
        player.energy=Math.max(18,player.energy-8-Math.random()*5);
        player.mental=Math.max(-10,Math.min(10,player.mental+(win?1:-1)));
      });
      const opponentName=randomFictionalName(mode==="1v1"?1:mode==="2v2"?2:3);
      applyPlayerCareerGrowth(players,{source:"ranked",win,impact:Math.abs(delta)/28});
      const score=`${result.ownGoals}–${result.opponentGoals}`;
      state.rankedGamesToday++;
      recordCompetitiveMatch({type:"ranked",mode,players:players.map(player=>player.name),opponent:opponentName,score,win,delta,week:state.week,calendarDate:state.gameDate});
      addNews(`${win?"Vitória":"Derrota"} ranked ${mode} ${score} frente a ${opponentName}. ${delta>0?"+":""}${delta} MMR por jogador.`);
      render();
      toast(`${win?"Vitória":"Derrota"} ${score} · ${delta>0?"+":""}${delta} MMR por jogador.`);
    }

    /* ===== EXTENSÕES: mundo, olheiros, pesquisa, treino diário, definições ===== */
    const clampN=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
    const normText=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();

    const WORLD_TRAITS=["Decisivo em jogos grandes","Excelente mecânico","Líder vocal","Mentalidade de ferro","Inconstante","Joga arriscado","Rotações perfeitas","Defesa sólida","Cresce sob pressão","Jogador de equipa"];
    const SCOUT_TIERS={
      novo:{name:"Novo",j:42,n:30,d:7,color:""},

    function ensureWorldState(s){
      const obj=v=>v&&typeof v==="object"&&!Array.isArray(v);
      if(!Array.isArray(s.scouts)) s.scouts=[];
      if(!obj(s.scoutReports)) s.scoutReports={};
      if(!Array.isArray(s.shortlist)) s.shortlist=[];

      if(!Array.isArray(s.hiredScoutIds)) s.hiredScoutIds=[];
      if(!Array.isArray(s.trainingLog)) s.trainingLog=[];
      if(!obj(s.lbView)) s.lbView={region:"all",count:50,q:"",retired:true};
      const keys=["rest","replays","mechanics","defense","comms","mechanics","replays"];

    function worldAge(p){return p.age+Math.max(0,Number(state.gameDate.slice(0,4))-START_SEASON_YEAR);}
    function trueSkill(p,mode="3v3"){return p.mmr[mode]+(state.worldSkill[p.name]||0);}
    function trueOvr(p){return worldOvr(trueSkill(p,"3v3"));}
    function worldAttrs(p){
      const r=mulberry32(hashStr(p.name+"|attrs"));
      const base=trueOvr(p),off={};
      ATTRS.forEach(a=>off[a]=(r()-.5)*16);
      const w={AER:.25,ROT:.2,DEF:.2,SHO:.15,BST:.1,COM:.1};
      const shift=Object.keys(w).reduce((sum,a)=>sum+off[a]*w[a],0);
      const out={};
      ATTRS.forEach(a=>out[a]=clampN(Math.round(base+off[a]-shift),30,99));
      return out;
    }
    function worldTraits(p){
      const r=mulberry32(hashStr(p.name+"|traits"));
      const a=Math.floor(r()*WORLD_TRAITS.length);
      let b=Math.floor(r()*WORLD_TRAITS.length);
      if(b===a) b=(b+1)%WORLD_TRAITS.length;
      return [WORLD_TRAITS[a],WORLD_TRAITS[b]];
    }
    function worldPrice(p){
      const mmr=state.rankedLadderMMR[p.name]?.["3v3"]??p.mmr["3v3"];

      value*=age<21?1.3:age>29?.7:1;

      return Math.round(value/50)*50;

    function rankedPosition(name,mode){return ladderBoard(mode).findIndex(r=>r.name===name)+1;}
    function ladderBoard(mode){
      const rows=[];
      RANKED_LADDER.forEach(p=>{
        if(state.signedPool[p.name]) return;
        const m=state.rankedLadderMMR[p.name],g=state.rankedLadderGames[p.name];
        if(!m||!g) return;
        rows.push({name:p.name,team:p.retired?"":p.team,retired:!!p.retired,real:!!p.real,country:p.country||"",mmr:m[mode],games:g[mode],titles:[],user:false});
      });
      state.roster.forEach(pl=>{
        if(pl.rankedGames[mode]>0) rows.push({name:pl.name,team:state.teamName,retired:false,real:false,country:pl.nationality||"",mmr:pl.rankedMMR[mode],games:pl.rankedGames[mode],titles:Array.isArray(pl.titles)?pl.titles:[],user:true});
      });
      return rows.sort((a,b)=>b.mmr-a.mmr||a.name.localeCompare(b.name));
    }
    /* ---- Leaderboard diário: ~75 partidas por jogador ---- */
    refreshLeaderboardDaily=function(){
      ensureWorldState(state);
      MODE_LIST.forEach(mode=>{
        const snap={};
        ladderBoard(mode).slice(0,200).forEach((row,i)=>{snap[row.name]=i+1;});
        state.prevRank[mode]=snap;
      });
      const rnd=Math.random;
      RANKED_LADDER.forEach(p=>{
        if(state.signedPool[p.name]) return;
        const mmr=state.rankedLadderMMR[p.name],games=state.rankedLadderGames[p.name];
        if(!mmr||!games) return;
        const habit=stableValue(p.name,100)/100;
        const activity=p.retired?0.02+0.1*habit:p.real?0.6+0.4*habit:0.15+0.85*habit;
        const total=Math.min(RANKED_DAILY_LIMIT,Math.round(RANKED_DAILY_LIMIT*activity*(0.85+rnd()*0.3)));
        if(total<=0) return;
        const form=(rnd()+rnd()-1)*30;
        MODE_LIST.forEach(mode=>{
          const count=Math.round(total*MODE_WEIGHT[mode]+rnd());
          if(!count) return;
          const skill=trueSkill(p,mode)+form;
          let current=mmr[mode];
          for(let i=0;i<count;i++){
            const opponent=current+(rnd()+rnd()-1)*120;
            const winChance=1/(1+Math.pow(10,(opponent-skill)/400));
            const expected=1/(1+Math.pow(10,(opponent-current)/400));
            current+=6*((rnd()<winChance?1:0)-expected);
          }
          mmr[mode]=clampN(Math.round(current),0,2100);
          games[mode]=(games[mode]||0)+count;
        });
      });
      const leader=ladderBoard("3v3")[0];
      if(leader&&state.lbLeader&&state.lbLeader!==leader.name) addNews(`${leader.name} é o novo nº 1 do leaderboard 3v3 (${leader.mmr} MMR).`);
      if(leader) state.lbLeader=leader.name;
      state.leaderboardLastUpdate=Date.now();
    };
    /* ---- Treino dinâmico, olheiros, mundo e patrocínios: tudo diário ---- */
    function trainingDaily(){
      const dow=parseGameDate(state.gameDate).getUTCDay();
      let key=state.trainingPlan[dow];
      if(state.staff?.coach&&avg("energy")<48) key="rest";
      state.training=key;
      const focus=TRAINING[key];
      const map={mechanics:["AER","SHO"],replays:["ROT","COM"],defense:["DEF","BST"]};
      const gains=[];
      state.roster.forEach(p=>{
        const starter=state.lineup.includes(p.id);
        if(key==="rest") p.energy=Math.min(100,p.energy+14);
        else p.energy=clampN(p.energy-focus.energy/3,0,100);
        if(map[key]&&p.energy>=30){
          const chance=(starter?0.13:0.08)*(p.age<=21?1.5:p.age>=28?0.7:1);
          map[key].forEach(attribute=>{
            if(Math.random()<chance&&p[attribute]<99){p[attribute]++;gains.push(`${p.name} +1 ${attribute}`);}
          });
        }
        if(p.energy<35&&Math.random()<0.1) p.mental=Math.max(-10,p.mental-1);
      });
      if(key==="comms"&&Math.random()<0.9) state.synergy=Math.min(100,state.synergy+1);
      else if(key==="replays"&&Math.random()<0.3) state.synergy=Math.min(100,state.synergy+1);

    function scoutDaily(){
      state.scouts.forEach(scout=>{
        if(!scout.task) return;
        scout.task.daysLeft--;
        if(scout.task.daysLeft>0) return;
        const p=WORLD_BY_NAME[scout.task.player];
        scout.task=null;
        if(!p) return;
        const sd=(100-scout.judgement)/7;
        const noise=sd=>(Math.random()+Math.random()+Math.random()-1.5)*sd*1.6;
        const truth=worldAttrs(p);
        const attrs={};
        ATTRS.forEach(a=>attrs[a]=clampN(Math.round(truth[a]+noise(sd*1.3)),20,99));
        const known=ATTRS.filter(a=>a!=="CLU").reduce((o,a)=>({...o,[a]:attrs[a]}),{});
        const estOvr=ovr(known);
        const pot=clampN(Math.round(p.pot+noise(sd*1.5)),30,99);
        const traits=worldTraits(p).filter(()=>Math.random()<scout.network/100+0.25);
        state.scoutReports[p.name]={date:state.gameDate,scout:scout.name,tier:scout.tier,attrs,ovr:estOvr,pot,traits,margin:Math.max(1,Math.round(sd*1.2)),accuracy:Math.round(scout.judgement)};
        addNews(`${scout.name} concluiu o relatório sobre ${p.name} (OVR estimado ${estOvr}, potencial ~${pot}).`);
        toast(`Relatório pronto: ${p.name}.`);
      });

      const called=state.roster.filter(p=>squad.some(s=>s.user&&s.id===p.id));

      const myStrength=nationStrength(country);
      const rivals=nationRanking().filter(r=>r.country!==country).slice(0,10).sort((a,b)=>stableValue(`${state.season}${country}${a.country}`,100)-stableValue(`${state.season}${country}${b.country}`,100)).slice(0,3);

          <section class="card"><div class="card-head"><h2>Ranked</h2><span class="pill">DADOS PÚBLICOS</span></div><div class="table-wrap"><table><thead><tr><th>Modo</th><th>Divisão</th><th>MMR</th><th>Posição</th><th>Jogos</th></tr></thead><tbody>${MODE_LIST.map(m=>`<tr><td>${m}</td><td>${rankName(mmr[m],m)}</td><td>${mmr[m]}</td><td>#${rankedPosition(name,m)}</td><td>${games[m]}</td></tr>`).join("")}</tbody></table></div></section>
          <section class="card"><div class="card-head"><h2>Informação de scouting</h2><span class="pill ${report?"green":"orange"}">${report?"RELATÓRIO":"SEM INFORMAÇÃO"}</span></div>
            ${report?`<div class="attribute-grid">${["AER","ROT","DEF","SHO","BST","COM"].map(a=>`<div class="attribute"><b>${attr20(report.attrs[a])}</b><span>${a}</span></div>`).join("")}</div><div class="section-gap"><div class="rating" style="justify-content:flex-start;gap:10px">${report.ovr}<small>OVR estimado ±${report.margin}</small></div><div class="muted tiny">Potencial estimado: ${starHTML(clampN(Math.round((report.pot-35)/13*2)/2,0.5,5))} (${report.pot})</div>${report.traits.length?`<div class="title-stack section-gap">${report.traits.map(t=>`<span class="title-chip">${esc(t)}</span>`).join("")}</div>`:'<div class="muted tiny section-gap">Nenhum traço oculto revelado.</div>'}<div class="footer-note">Relatório de ${esc(report.scout)} em ${esc(formatGameDate(report.date,{day:"numeric",month:"short",year:"numeric"}))}. Quanto melhor o olheiro, menor a margem de erro.</div></div>`:`<div class="attribute-grid">${["AER","ROT","DEF","SHO","BST","COM"].map(a=>`<div class="attribute"><b>?</b><span>${a}</span></div>`).join("")}</div><p class="muted section-gap">Sem informação sobre os atributos deste jogador. Envia um olheiro para o observar durante a semana.</p>`}
            <div class="section-gap">${sc?`<span class="pill green">EM OBSERVAÇÃO</span> <span class="muted tiny">${esc(sc.name)} · ${sc.task.daysLeft} dia(s) restantes</span>`:free.length?`<div class="form-row"><label for="scout-pick">Enviar olheiro</label><select id="scout-pick">${free.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${SCOUT_TIERS[s.tier].name} · ${s.days} dias</option>`).join("")}</select></div><button class="button primary" data-action="scout-send" data-player="${enc(name)}">◉ Enviar olheiro</button>`:`<span class="muted tiny">Não tens olheiros livres.</span> <button class="button small" data-page="scouting">Ir ao Observatório</button>`}</div>
          </section>
          <section class="card"><div class="card-head"><h2>Ações</h2></div><div class="match-actions"><button class="button ${inList?"green":""}" data-action="shortlist" data-player="${enc(name)}">${inList?"★ Na lista de observação":"☆ Adicionar à lista"}</button>${p.retired?'<span class="pill orange">APOSENTADO · INDISPONÍVEL</span>':signed?'<span class="pill green">NO TEU PLANTEL</span>':`<button class="button primary" data-action="sign-world" data-player="${enc(name)}" ${!report||state.money<fee?"disabled":""}>Fazer oferta · ${fmtMoney(fee)}</button>`}</div><p class="footer-note">${report?"Preço baseado no MMR e idade do jogador.":"Só podes fazer uma oferta depois de teres um relatório de scouting."}${p.real?" Os dados de jogadores reais são aproximados, apenas para simulação.":""}</p></section>
        </div>`;
    }
    function renderTeamDetail(team){
      const players=WORLD_TEAMS[team]||[];
      const league=LEAGUE_SPECS.find(l=>l.teams.includes(team));
      const avgMMR=players.length?Math.round(players.reduce((s,p)=>s+(state.rankedLadderMMR[p.name]?.["3v3"]??p.mmr["3v3"]),0)/players.length):0;
      return `<div class="page-head"><div><div class="eyebrow">Equipa${league?" · "+esc(league.name):""}</div><h1>${esc(team)}</h1><div class="subhead">${players.length} jogadores · MMR médio 3v3 ${avgMMR}</div></div>${backBtn()}</div>
        <section class="card">${players.length?`<div class="roster-mini">${playerListRows(players)}</div>`:`<div class="empty">Sem jogadores conhecidos nesta equipa.</div>`}${league?`<div class="section-gap"><button class="button small" data-open="league:${enc(league.id)}">Ver liga</button></div>`:""}</section>`;
    }
    function renderLeagueDetail(id){
      const league=LEAGUE_SPECS.find(l=>l.id===id);
      if(!league) return `<div class="page-head"><h1>Liga não encontrada</h1>${backBtn()}</div>`;
      return `<div class="page-head"><div><div class="eyebrow">${esc(league.region)}</div><h1>${esc(league.name)}</h1><div class="subhead">${league.teams.length} equipas</div></div>${backBtn()}</div>
        <div class="grid two-col">${league.teams.map(t=>{const pl=WORLD_TEAMS[t]||[];const a=pl.length?Math.round(pl.reduce((s,p)=>s+(state.rankedLadderMMR[p.name]?.["3v3"]??p.mmr["3v3"]),0)/pl.length):0;return `<section class="card"><div class="card-head"><h2><a href="#" class="plink" data-open="team:${enc(t)}">${esc(t)}</a></h2><span class="pill">${a} MMR</span></div><div class="roster-mini">${playerListRows(pl)}</div></section>`;}).join("")}</div>`;
    }
    function renderNationDetail(country){
      const players=WORLD.filter(p=>p.country===country).sort((a,b)=>trueOvr(b)-trueOvr(a));
      const squad=nationSquad(country);
      return `<div class="page-head"><div><div class="eyebrow">${esc(countryRegion(country))}</div><h1>${countryFlag(country)} ${esc(country)}</h1><div class="subhead">${players.length} jogadores no mundo · força da seleção ${nationStrength(country)}</div></div>${backBtn()}</div>
        <div class="grid two-col"><section class="card"><div class="card-head"><h2>Convocados (top 3 por overall)</h2></div><div class="roster-mini">${squad.map(s=>`<div class="player-row"><div class="player-info">${avatarHTML(s.name,s.real)}<div><div class="player-name">${esc(s.name)}</div><div class="player-meta">${s.user?"Teu plantel":"Mundo"}</div></div></div><div class="rating">${s.ovr}<small>OVR</small></div></div>`).join("")||'<div class="empty">Sem jogadores.</div>'}</div></section>
        <section class="card"><div class="card-head"><h2>Melhores jogadores</h2><span class="pill">${players.length}</span></div><div class="roster-mini">${playerListRows(players.slice(0,12))}</div></section></div>`;
    }
    function renderDetail(){
      const d=state.detail||{};
      if(d.type==="player") return renderPlayerDetail(d.key);
      if(d.type==="team") return renderTeamDetail(d.key);
      if(d.type==="league") return renderLeagueDetail(d.key);
      if(d.type==="nation") return renderNationDetail(d.key);
      return renderOverview();
    }
    function openDetail(type,key){
      ensureWorldState(state);
      if(type==="page"){page=key;render();return;}
      if(type==="mine"){page="roster";render();return;}
      if(type==="team"&&key===state.teamName){page="roster";render();return;}
      if(page!=="detail") state.detailBack=page;
      state.detail={type,key};page="detail";
      render();window.scrollTo(0,0);
    }
    /* ---- Pesquisa global (estilo Football Manager) ---- */
    let searchIndex=null;
    function buildSearchIndex(){
      const items=[];
      WORLD.forEach(p=>items.push({g:"Jogadores",type:"player",key:p.name,label:p.name,sub:`${countryFlag(p.country)} ${p.country} · ${p.retired?"Aposentado":p.team||"Agente livre"}`,real:p.real,hay:normText(`${p.name} ${p.full} ${p.team} ${p.country}`)}));
      const teams=new Set(Object.keys(WORLD_TEAMS));LEAGUE_SPECS.forEach(l=>l.teams.forEach(t=>teams.add(t)));
      teams.forEach(t=>items.push({g:"Equipas",type:"team",key:t,label:t,sub:"Equipa",hay:normText(t)}));
      LEAGUE_SPECS.forEach(l=>items.push({g:"Ligas",type:"league",key:l.id,label:l.name,sub:l.region,hay:normText(l.name+" "+l.region)}));
      WORLD_COUNTRY_LIST.forEach(c=>items.push({g:"Seleções",type:"nation",key:c,label:`${countryFlag(c)} ${c}`,sub:countryRegion(c),hay:normText(c+" "+countryRegion(c))}));
      Object.entries(NAV_PAGES).forEach(([k,v])=>items.push({g:"Páginas",type:"page",key:k,label:v[1],sub:"Ir para",hay:normText(v[1])}));
      return items;
    }
    function runSearch(query){
      const root=document.getElementById("search-results");
      const q=normText(query).trim();
      if(!q){root.hidden=true;root.innerHTML="";return;}
      if(!searchIndex) searchIndex=buildSearchIndex();
      const tokens=q.split(/\s+/);
      const groups={};
      let count=0;
      const mine=(careerStarted?state.roster:[]).filter(p=>tokens.every(t=>normText(p.name).includes(t))).map(p=>({g:"O teu plantel",type:"mine",key:p.id,label:p.name,sub:`${p.nationality} · ${p.role}`,hay:normText(p.name)}));
      const scored=[...mine,...searchIndex.filter(it=>tokens.every(t=>it.hay.includes(t)))].map(it=>({it,s:(it.hay.startsWith(q)?0:1)+(it.g==="Jogadores"?0.2:0)})).sort((a,b)=>a.s-b.s);
      for(const {it} of scored){
        const arr=groups[it.g]||(groups[it.g]=[]);
        if(arr.length>=6||count>=24) continue;
        arr.push(it);count++;
      }
      root.innerHTML=count?Object.entries(groups).map(([g,items])=>`<div class="sr-group">${esc(g)}</div>${items.map(it=>`<button class="sr-item" data-open="${it.type}:${enc(it.key)}">${it.type==="player"?`<span class="sr-av">${avatarSVG(it.key,it.real)}</span>`:""}<span class="sr-label">${esc(it.label)}</span><span class="sr-sub">${esc(it.sub)}</span></button>`).join("")}`).join(""):`<div class="sr-empty">Sem resultados para "${esc(query)}".</div>`;
      root.hidden=false;
    }
    /* ---- Definições ---- */
    const SETTINGS_KEY="rlm-settings";
    let settings={master:80,music:35,sfx:70,mute:false,displayMode:"window",resolution:"auto",uiScale:100,reduceMotion:false};
    try{Object.assign(settings,JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}"));}catch{}
    const desktopApi=window.rlmDesktop||null;
    let audioCtx=null,musicTimer=null,musicStep=0;
    function audioEnsure(){
      if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;audioCtx=new AC();}
      if(audioCtx.state==="suspended") audioCtx.resume();
      return audioCtx;
    }
    function vol(kind){return settings.mute?0:(settings.master/100)*(settings[kind]/100);}
    function playClick(){
      const v=vol("sfx");if(v<=0)return;
      const c=audioEnsure();if(!c)return;
      const o=c.createOscillator(),g=c.createGain();
      o.type="triangle";o.frequency.setValueAtTime(660,c.currentTime);o.frequency.exponentialRampToValueAtTime(440,c.currentTime+.08);
      g.gain.setValueAtTime(.2*v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.14);
    }
    const MUSIC_NOTES=[220,261.6,329.6,392,220,261.6,349.2,440,261.6,329.6,392,523.2,196,246.9,293.7,392];
    function musicTick(){
      const v=vol("music");if(v<=0||!audioCtx)return;
      const c=audioCtx,f=MUSIC_NOTES[musicStep++%MUSIC_NOTES.length];
      const o=c.createOscillator(),g=c.createGain();
      o.type="sine";o.frequency.value=f;
      g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(.09*v,c.currentTime+.05);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.1);
      o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+1.2);
    }
    function syncMusic(){
      if(vol("music")>0&&audioCtx){if(!musicTimer)musicTimer=setInterval(musicTick,520);}
      else if(musicTimer){clearInterval(musicTimer);musicTimer=null;}
    }
    function applyDisplay(fromUser){
      let zoom=settings.uiScale/100;
      const [w,h]=settings.resolution==="auto"?[0,0]:settings.resolution.split("x").map(Number);
      if(w&&settings.displayMode!=="window") zoom*=clampN(screen.width/w,.6,1.8);
      document.documentElement.style.zoom=String(zoom);
      document.body.classList.toggle("reduce-motion",!!settings.reduceMotion);
      if(desktopApi){
        if(fromUser||settings.displayMode!=="window"){
          try{localStorage.setItem("rlm-resume",JSON.stringify({id:activeSaveId,page}));}catch{}
        }
        desktopApi.setDisplay({mode:settings.displayMode,width:w,height:h}).catch(()=>{});
      } else if(fromUser){
        if(settings.displayMode!=="window"){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});}
        else if(document.fullscreenElement) document.exitFullscreen?.();
      }
    }
    function persistSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify(settings));}catch{}}
    function settingsHTML(){
      const slider=(key,label)=>`<label class="set-row"><span>${label}</span><input type="range" min="0" max="100" value="${settings[key]}" data-set="${key}"><b data-val="${key}">${settings[key]}%</b></label>`;
      const modes=[["window","Janela"],["borderless","Ecrã inteiro em janela"],["fullscreen","Ecrã inteiro"]];
      const resolutions=[["auto","Automática"],["1280x720","1280 × 720"],["1366x768","1366 × 768"],["1600x900","1600 × 900"],["1920x1080","1920 × 1080"],["2560x1440","2560 × 1440"]];
      return `<div class="modal-backdrop" data-action="close-settings"></div><div class="modal-card" role="dialog" aria-label="Definições"><div class="card-head"><h2>⚙ Definições</h2><button class="button small" data-action="close-settings">Fechar ✕</button></div>
        <h3 class="set-title">Áudio</h3>${slider("master","Volume geral")}${slider("music","Música")}${slider("sfx","Efeitos")}<label class="set-row"><span>Silenciar tudo</span><input type="checkbox" data-set="mute" ${settings.mute?"checked":""}></label>
        <h3 class="set-title">Ecrã</h3><label class="set-row"><span>Modo de ecrã</span><select data-set="displayMode">${modes.map(([v,l])=>`<option value="${v}" ${settings.displayMode===v?"selected":""}>${l}</option>`).join("")}</select></label>
        <label class="set-row"><span>Resolução</span><select data-set="resolution">${resolutions.map(([v,l])=>`<option value="${v}" ${settings.resolution===v?"selected":""}>${l}</option>`).join("")}</select></label>
        <label class="set-row"><span>Escala da interface</span><input type="range" min="75" max="140" step="5" value="${settings.uiScale}" data-set="uiScale"><b data-val="uiScale">${settings.uiScale}%</b></label>
        <label class="set-row"><span>Reduzir animações</span><input type="checkbox" data-set="reduceMotion" ${settings.reduceMotion?"checked":""}></label>
        <p class="footer-note">${desktopApi?"Em modo janela, a resolução define o tamanho da janela. Nos modos de ecrã inteiro, funciona como escala de renderização.":"No navegador, a resolução funciona como escala de renderização nos modos de ecrã inteiro."}</p>
        <div class="match-actions section-gap">${careerStarted?'<button class="button" data-action="save-now">💾 Guardar agora</button><button class="button danger" data-action="goto-menu">Sair para o menu principal</button>':""}<button class="button" data-action="settings-reset">Repor predefinições</button></div></div>`;
    }
    function openSettings(){
      let root=document.getElementById("settings-root");
      if(!root){root=document.createElement("div");root.id="settings-root";document.body.appendChild(root);}
      root.innerHTML=settingsHTML();
    }
    function closeSettings(){const root=document.getElementById("settings-root");if(root)root.innerHTML="";}
    /* ---- Ligações de eventos ---- */
    document.addEventListener("click",event=>{
      if(!audioCtx&&(vol("sfx")>0||vol("music")>0)){audioEnsure();syncMusic();}
      if(event.target.closest("button,.nav-btn,.sr-item,.plink")) playClick();
      const open=event.target.closest("[data-open]");
      if(open){
        event.preventDefault();
        const [type,...rest]=open.dataset.open.split(":");
        const sr=document.getElementById("search-results");if(sr)sr.hidden=true;
        const input=document.getElementById("global-search");if(input)input.value="";
        openDetail(type,decodeURIComponent(rest.join(":")));return;
      }
      if(!event.target.closest("#search-wrap")){const sr=document.getElementById("search-results");if(sr)sr.hidden=true;}
      const action=event.target.closest("[data-action]")?.dataset.action;
      const el=event.target.closest("[data-action]");
      if(!action) return;
      if(action==="open-settings") openSettings();
      else if(action==="close-settings") closeSettings();
      else if(action==="settings-reset"){settings={master:80,music:35,sfx:70,mute:false,displayMode:"window",resolution:"auto",uiScale:100,reduceMotion:false};persistSettings();applyDisplay(true);syncMusic();openSettings();}
      else if(action==="save-now"){save();toast("Carreira guardada.");}
      else if(action==="goto-menu"){closeSettings();careerStarted=false;menuView="home";render();}
      else if(action==="scout-hire") hireScout(el.dataset.id);
      else if(action==="scout-send") sendScout(decodeURIComponent(el.dataset.player),document.getElementById("scout-pick")?.value);
      else if(action==="shortlist"){const n=decodeURIComponent(el.dataset.player);ensureWorldState(state);state.shortlist=state.shortlist.includes(n)?state.shortlist.filter(x=>x!==n):[...state.shortlist,n];render();}
      else if(action==="sign-world") signWorldPlayer(decodeURIComponent(el.dataset.player));
      else if(action==="detail-back"){page=state.detailBack||"overview";render();}
      else if(action==="plan-auto"){state.trainingPlan=["rest","replays","mechanics","defense","comms","mechanics","replays"];render();}
      else if(action==="plan-intense"){state.trainingPlan=["rest","mechanics","mechanics","defense","mechanics","defense","replays"];render();}
    });
    document.addEventListener("input",event=>{
      const t=event.target;
      if(t.id==="global-search"){runSearch(t.value);return;}
      if(t.matches("[data-set]")&&t.type==="range"){
        settings[t.dataset.set]=Number(t.value);
        const label=document.querySelector(`[data-val="${t.dataset.set}"]`);if(label)label.textContent=t.value+"%";
        persistSettings();
        if(t.dataset.set==="uiScale") applyDisplay(false);
        if(!audioCtx&&vol("music")>0) audioEnsure();
        syncMusic();
      }
    });
    document.addEventListener("change",event=>{
      const t=event.target;
      if(t.matches("[data-set]")&&t.type!=="range"){
        settings[t.dataset.set]=t.type==="checkbox"?t.checked:t.value;
        persistSettings();applyDisplay(true);if(t.dataset.set==="mute")syncMusic();return;
      }
      if(t.matches("[data-lb]")){
        ensureWorldState(state);
        const key=t.dataset.lb;
        state.lbView[key]=t.type==="checkbox"?t.checked:t.value;
        render();return;
      }
      if(t.matches("[data-plan]")){
        state.trainingPlan[Number(t.dataset.plan)]=t.value;render();
      }
    });
    document.addEventListener("keydown",event=>{
      const input=document.getElementById("global-search");
      if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="k"){event.preventDefault();input?.focus();input?.select();return;}
      if(event.key==="/"&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||"")){event.preventDefault();input?.focus();return;}
      if(event.key==="Escape"){
        if(document.getElementById("settings-root")?.innerHTML){closeSettings();return;}
        if(document.activeElement===input){input.blur();document.getElementById("search-results").hidden=true;}
      }
      if(event.key==="Enter"&&document.activeElement===input){
        const first=document.querySelector("#search-results .sr-item");if(first)first.click();
      }
    });
    applyDisplay(false);
    try{
      const resume=JSON.parse(localStorage.getItem("rlm-resume")||"null");
      localStorage.removeItem("rlm-resume");
      if(resume&&resume.id&&saveSlots.some(s=>s.id===resume.id)){openCareer(resume.id);if(resume.page&&resume.page!=="detail")page=resume.page;}
    }catch{}
    render();
  </script>
  <script src="assets/match3d.js"></script>
</body>
</html>
